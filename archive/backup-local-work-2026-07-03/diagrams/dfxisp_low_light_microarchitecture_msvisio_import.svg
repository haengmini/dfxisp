<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#404040"/></marker></defs>
 <rect width="100%" height="100%" fill="#ffffff"/>
 <text x="40" y="45" font-family="Calibri,Arial" font-size="28" font-weight="700" fill="#1f4e79">DFXISP LOW_LIGHT RM Micro-architecture</text>
<rect x="50" y="120" width="210" height="85" rx="14" fill="#f2f2f2" stroke="#595959" stroke-width="3"/><text x="155.0" y="149.5" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">RAW12 input</text><text x="155.0" y="179.5" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">GRBG stream</text>
<rect x="350" y="105" width="250" height="110" rx="14" fill="#ffe5cc" stroke="#c55a11" stroke-width="3"/><text x="475.0" y="147.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">Line/window</text><text x="475.0" y="177.0" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">2-row buffer</text><text x="475.0" y="199.0" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">2x2 window</text>
<rect x="700" y="105" width="260" height="110" rx="14" fill="#ffe5cc" stroke="#c55a11" stroke-width="3"/><text x="830.0" y="147.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">RAW binning</text><text x="830.0" y="177.0" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">(p00+p01+p10+p11)/4</text><text x="830.0" y="199.0" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">H/2 × W/2</text>
<rect x="1060" y="120" width="220" height="85" rx="14" fill="#ffe5cc" stroke="#c55a11" stroke-width="3"/><text x="1170.0" y="149.5" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">Binned RAW</text><text x="1170.0" y="179.5" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">scratch now</text><text x="1170.0" y="201.5" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">streaming later</text>
<rect x="90" y="320" width="1350" height="210" rx="14" fill="#ddebf7" stroke="#2f75b5" stroke-width="3" stroke-dasharray="10 6"/><text x="765.0" y="425.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">Shared baseline ISP core - no tone gain/gamma</text>
<rect x="150" y="390" width="170" height="90" rx="14" fill="#ddebf7" stroke="#2f75b5" stroke-width="3"/><text x="235.0" y="435.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">3x3</text><text x="235.0" y="457.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">demosaic</text>
<rect x="370" y="390" width="170" height="90" rx="14" fill="#ddebf7" stroke="#2f75b5" stroke-width="3"/><text x="455.0" y="435.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">RAW12→RGB8</text>
<rect x="590" y="390" width="170" height="90" rx="14" fill="#ddebf7" stroke="#2f75b5" stroke-width="3"/><text x="675.0" y="435.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">BLC</text><text x="675.0" y="457.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">offset=16</text>
<rect x="810" y="390" width="170" height="90" rx="14" fill="#ddebf7" stroke="#2f75b5" stroke-width="3"/><text x="895.0" y="435.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">AWB</text><text x="895.0" y="457.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">Q8 gains</text>
<rect x="1030" y="390" width="170" height="90" rx="14" fill="#ddebf7" stroke="#2f75b5" stroke-width="3"/><text x="1115.0" y="435.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">CCM</text><text x="1115.0" y="457.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">identity</text>
<rect x="180" y="640" width="1100" height="165" rx="14" fill="#ffe5cc" stroke="#c55a11" stroke-width="3" stroke-dasharray="10 6"/><text x="730.0" y="722.5" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">RM_LOW_LIGHT_TONE.back - tone stage</text>
<rect x="290" y="700" width="210" height="80" rx="14" fill="#ffe5cc" stroke="#c55a11" stroke-width="3"/><text x="395.0" y="727.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">Gain</text><text x="395.0" y="757.0" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">1.25×</text>
<rect x="640" y="685" width="260" height="105" rx="14" fill="#ffe5cc" stroke="#c55a11" stroke-width="3"/><text x="770.0" y="724.5" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">Gamma-4.0</text><text x="770.0" y="754.5" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">integer 4th-root</text><text x="770.0" y="776.5" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">or 256-entry LUT</text>
<rect x="1030" y="700" width="220" height="80" rx="14" fill="#ffe5cc" stroke="#c55a11" stroke-width="3"/><text x="1140.0" y="727.0" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">RGB32 pack</text><text x="1140.0" y="757.0" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">0x00RRGGBB</text>
<rect x="500" y="870" width="560" height="75" rx="14" fill="#eae0f5" stroke="#7030a0" stroke-width="3"/><text x="780.0" y="894.5" text-anchor="middle" font-family="Calibri,Arial" font-size="22" font-weight="700" fill="#111111">Output metadata</text><text x="780.0" y="924.5" text-anchor="middle" font-family="Calibri,Arial" font-size="17" font-weight="400" fill="#111111">LOW_LIGHT, RM_LOW_LIGHT_TONE, out=H/2×W/2</text>
